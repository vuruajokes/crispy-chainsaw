name: Build EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller opencv-python pillow moviepy pygame imageio-ffmpeg

      - name: Build exe
        run: |
          pyinstaller --onefile --windowed --name YandexCall `
            --collect-all moviepy `
            --collect-all imageio_ffmpeg `
            --add-data "Dasha.jpeg;." `
            --add-data "Dasha.mp4;." `
            prank.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YandexCall-exe
          path: dist/YandexCall.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/YandexCall.exe
